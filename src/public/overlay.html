<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fishing Overlay</title>
<style>
  * { box-sizing:border-box; }
  html,body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; font-family:Inter,Arial,sans-serif; }
  .stage { width:100%; height:100%; display:flex; align-items:flex-end; justify-content:center; padding-bottom:72px; pointer-events:none; }
  .card { width:auto; min-width:340px; max-width:500px; padding:15px 22px; border-radius:14px; background:rgba(6,18,28,.90); border:1px solid rgba(121,226,207,.34); box-shadow:0 16px 42px rgba(0,0,0,.34); color:white; text-align:center; opacity:0; transform:translateY(20px) scale(.98); transition:.28s ease; }
  .card.show { opacity:1; transform:translateY(0) scale(1); }
  .name { font-size:19px; font-weight:800; }
  .fishing { font-size:13px; color:#8be6d1; margin-top:5px; letter-spacing:.09em; }
  .hook { font-size:35px; animation:bob .9s ease-in-out infinite; margin:8px 0 2px; }
  .item { font-size:24px; font-weight:900; line-height:1.08; margin:6px 0 3px; }
  .rarity { font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#ffd45f; }
  .gold { font-size:16px; font-weight:800; color:#ffd45f; margin-top:6px; }
  @keyframes bob { 50% { transform:translateY(6px) rotate(5deg); } }
</style>
</head>
<body>
<div class="stage"><div id="card" class="card"><div id="content"></div></div></div>
<script>
const card = document.getElementById('card');
const content = document.getElementById('content');
let hideTimer;
let soundEnabled = true;
let audioContext;

fetch('/api/status').then(r => r.json()).then(data => {
  soundEnabled = data?.settings?.overlay_sound_enabled !== '0';
}).catch(() => {});

function show(html, ms=4000) {
  clearTimeout(hideTimer);
  content.innerHTML = html;
  card.classList.add('show');
  if (ms) hideTimer = setTimeout(() => card.classList.remove('show'), ms);
}

function ctx() {
  if (!soundEnabled) return null;
  try {
    audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') audioContext.resume();
    return audioContext;
  } catch { return null; }
}

function playCastSound() {
  const c = ctx();
  if (!c) return;
  const now = c.currentTime;
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(720, now);
  osc.frequency.exponentialRampToValueAtTime(180, now + .18);
  gain.gain.setValueAtTime(.0001, now);
  gain.gain.exponentialRampToValueAtTime(.16, now + .015);
  gain.gain.exponentialRampToValueAtTime(.0001, now + .22);
  osc.connect(gain).connect(c.destination);
  osc.start(now); osc.stop(now + .24);
}

function playCatchSound(rarity) {
  const c = ctx();
  if (!c) return;
  const now = c.currentTime;
  const rare = ['Épico','Lendário','Mítico'].includes(rarity);
  const notes = rare ? [440, 660, 880] : [330, 520];
  notes.forEach((freq, index) => {
    const osc = c.createOscillator();
    const gain = c.createGain();
    const start = now + index * .075;
    osc.type = rare ? 'triangle' : 'sine';
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(.0001, start);
    gain.gain.exponentialRampToValueAtTime(.13, start + .015);
    gain.gain.exponentialRampToValueAtTime(.0001, start + .22);
    osc.connect(gain).connect(c.destination);
    osc.start(start); osc.stop(start + .24);
  });
}

const ws = new WebSocket(`ws://${location.host}/ws`);
ws.addEventListener('message', (event) => {
  const data = JSON.parse(event.data);
  if (data.type === 'fishing:start') {
    playCastSound();
    show(`<div class="name">${esc(data.user.displayName)}</div><div class="fishing">PESCANDO...</div><div class="hook">🎣</div>`, Math.max(1000, data.durationMs));
  }
  if (data.type === 'fishing:result') {
    playCatchSound(data.item.rarity);
    show(`<div class="name">${esc(data.user.displayName)}</div><div class="item">${esc(data.item.name)}</div><div class="rarity">${esc(data.item.rarity)}</div><div class="gold">+${Number(data.item.goldAwarded).toLocaleString('pt-BR')} OURO</div>`, 5200);
  }
});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
